<div class="editor-field" [class.editor-field-disabled]="disabled" [class.editor-field-readonly]="readonly" [class.editor-field-error]="errorText">
  <label *ngIf="label">
    {{ label }}
    <span *ngIf="required" class="required-marker">*</span>
  </label>

  <div class="editor-toolbar" aria-label="{{ 'Rich text formatting' | uiText }}">
    <button mat-icon-button type="button" matTooltip="{{ 'Undo' | uiText }}" [disabled]="disabled || readonly || isHtmlMode" (click)="format('undo')">
      <mat-icon class="material-symbols-outlined">undo</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Redo' | uiText }}" [disabled]="disabled || readonly || isHtmlMode" (click)="format('redo')">
      <mat-icon class="material-symbols-outlined">redo</mat-icon>
    </button>

    <span class="toolbar-divider"></span>

    <button mat-icon-button type="button" matTooltip="{{ 'Bold' | uiText }}" [class.active]="activeStates.bold" [disabled]="disabled || readonly || isHtmlMode" (click)="format('bold')">
      <mat-icon class="material-symbols-outlined">format_bold</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Italic' | uiText }}" [class.active]="activeStates.italic" [disabled]="disabled || readonly || isHtmlMode" (click)="format('italic')">
      <mat-icon class="material-symbols-outlined">format_italic</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Underline' | uiText }}" [class.active]="activeStates.underline" [disabled]="disabled || readonly || isHtmlMode" (click)="format('underline')">
      <mat-icon class="material-symbols-outlined">format_underlined</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Strikethrough' | uiText }}" [class.active]="activeStates.strikeThrough" [disabled]="disabled || readonly || isHtmlMode" (click)="format('strikeThrough')">
      <mat-icon class="material-symbols-outlined">strikethrough_s</mat-icon>
    </button>

    <span class="toolbar-divider"></span>

    <div class="color-menu">
      <button class="color-menu-trigger icon-only-color-trigger" type="button" matTooltip="{{ 'Text color' | uiText }}" [disabled]="disabled || readonly || isHtmlMode" (click)="toggleTextColorMenu()">
        <mat-icon class="material-symbols-outlined" [style.color]="selectedTextColor">format_color_text</mat-icon>
      </button>
      <div class="color-menu-panel" *ngIf="isTextColorMenuOpen">
        <button type="button" *ngFor="let color of textColors" [class.selected-color]="selectedTextColor === color.value" (click)="applyMenuColor('foreColor', color.value)">
          <span class="color-swatch" [style.background]="color.value"></span>
          {{ color.label }}
        </button>
      </div>
    </div>

    <div class="color-menu">
      <button class="color-menu-trigger icon-only-color-trigger" type="button" matTooltip="{{ 'Highlight color' | uiText }}" [class.no-highlight-selected]="selectedHighlightColor === 'transparent'" [style.background]="selectedHighlightColor === 'transparent' ? null : selectedHighlightColor" [disabled]="disabled || readonly || isHtmlMode" (click)="toggleHighlightMenu()">
        <mat-icon class="material-symbols-outlined">format_color_fill</mat-icon>
      </button>
      <div class="color-menu-panel" *ngIf="isHighlightMenuOpen">
        <button type="button" [class.selected-color]="selectedHighlightColor === 'transparent'" (click)="applyMenuHighlight('transparent')">
          <span class="color-swatch no-fill"></span>
          {{ 'No fill' | uiText }}
        </button>
        <button type="button" *ngFor="let color of highlightColors" [class.selected-color]="selectedHighlightColor === color.value" (click)="applyMenuHighlight(color.value)">
          <span class="color-swatch" [style.background]="color.value"></span>
          {{ color.label }}
        </button>
      </div>
    </div>

    <span class="toolbar-divider"></span>

    <select class="editor-select" aria-label="{{ 'Block format' | uiText }}" [value]="selectedBlockFormat" [disabled]="disabled || readonly || isHtmlMode" (change)="setBlockFormat($any($event.target).value)">
      <option value="p">{{ 'Paragraph' | uiText }}</option>
      <option value="h1">{{ 'Heading 1' | uiText }}</option>
      <option value="h2">{{ 'Heading 2' | uiText }}</option>
      <option value="h3">{{ 'Heading 3' | uiText }}</option>
      <option value="blockquote">{{ 'Quote' | uiText }}</option>
    </select>

    <select class="editor-select" aria-label="{{ 'Font size' | uiText }}" [value]="selectedFontSize" [disabled]="disabled || readonly || isHtmlMode" (change)="setFontSize($any($event.target).value)">
      <option value="2">{{ 'Small' | uiText }}</option>
      <option value="3">{{ 'Normal' | uiText }}</option>
      <option value="5">{{ 'Large' | uiText }}</option>
    </select>

    <span class="toolbar-divider"></span>

    <button mat-icon-button type="button" matTooltip="{{ 'Align left' | uiText }}" [class.active]="activeStates.justifyLeft" [disabled]="disabled || readonly || isHtmlMode" (click)="format('justifyLeft')">
      <mat-icon class="material-symbols-outlined">format_align_left</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Align center' | uiText }}" [class.active]="activeStates.justifyCenter" [disabled]="disabled || readonly || isHtmlMode" (click)="format('justifyCenter')">
      <mat-icon class="material-symbols-outlined">format_align_center</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Align right' | uiText }}" [class.active]="activeStates.justifyRight" [disabled]="disabled || readonly || isHtmlMode" (click)="format('justifyRight')">
      <mat-icon class="material-symbols-outlined">format_align_right</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Justify' | uiText }}" [disabled]="disabled || readonly || isHtmlMode" (click)="format('justifyFull')">
      <mat-icon class="material-symbols-outlined">format_align_justify</mat-icon>
    </button>

    <span class="toolbar-divider"></span>

    <button mat-icon-button type="button" matTooltip="{{ 'Bulleted list' | uiText }}" [class.active]="activeStates.insertUnorderedList" [disabled]="disabled || readonly || isHtmlMode" (click)="format('insertUnorderedList')">
      <mat-icon class="material-symbols-outlined">format_list_bulleted</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Numbered list' | uiText }}" [class.active]="activeStates.insertOrderedList" [disabled]="disabled || readonly || isHtmlMode" (click)="format('insertOrderedList')">
      <mat-icon class="material-symbols-outlined">format_list_numbered</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Decrease indent' | uiText }}" [disabled]="disabled || readonly || isHtmlMode" (click)="format('outdent')">
      <mat-icon class="material-symbols-outlined">format_indent_decrease</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Increase indent' | uiText }}" [disabled]="disabled || readonly || isHtmlMode" (click)="format('indent')">
      <mat-icon class="material-symbols-outlined">format_indent_increase</mat-icon>
    </button>

    <span class="toolbar-divider"></span>

    <button mat-icon-button type="button" matTooltip="{{ 'Table' | uiText }}" [class.active]="isTableMenuOpen" [disabled]="disabled || readonly || isHtmlMode" (click)="toggleTableMenu()">
      <mat-icon class="material-symbols-outlined">table</mat-icon>
    </button>

    <span class="toolbar-divider"></span>

    <button mat-icon-button type="button" matTooltip="{{ 'Insert link' | uiText }}" [disabled]="disabled || readonly || isHtmlMode" (click)="insertLink()">
      <mat-icon class="material-symbols-outlined">link</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Remove link' | uiText }}" [disabled]="disabled || readonly || isHtmlMode" (click)="removeLink()">
      <mat-icon class="material-symbols-outlined">link_off</mat-icon>
    </button>
    <button mat-icon-button type="button" matTooltip="{{ 'Clear formatting' | uiText }}" [disabled]="disabled || readonly || isHtmlMode" (click)="format('removeFormat')">
      <mat-icon class="material-symbols-outlined">format_clear</mat-icon>
    </button>

    <span class="toolbar-divider"></span>

    <button mat-icon-button type="button" matTooltip="{{ 'HTML view' | uiText }}" [class.active]="isHtmlMode" [disabled]="disabled" (click)="toggleHtmlMode()">
      <mat-icon class="material-symbols-outlined">code</mat-icon>
    </button>

  </div>

  <div class="table-toolbar" [class.table-toolbar-open]="isTableMenuOpen" [attr.aria-hidden]="!isTableMenuOpen" aria-label="{{ 'Table tools' | uiText }}">
    <span class="table-toolbar-title">{{ 'Insert table' | uiText }}</span>

    <label>
      {{ 'Rows' | uiText }}
      <input type="number" min="1" max="20" [value]="tableRows" [disabled]="disabled || readonly || isHtmlMode" (input)="tableRows = +$any($event.target).value" />
    </label>

    <label>
      {{ 'Columns' | uiText }}
      <input type="number" min="1" max="10" [value]="tableColumns" [disabled]="disabled || readonly || isHtmlMode" (input)="tableColumns = +$any($event.target).value" />
    </label>

    <span class="toolbar-divider"></span>

    <label>
      {{ 'Border' | uiText }}
      <input type="number" min="0" max="10" [value]="tableBorderWidth" [disabled]="disabled || readonly || isHtmlMode" (input)="tableBorderWidth = +$any($event.target).value" />
    </label>

    <select class="editor-select" aria-label="{{ 'Table border style' | uiText }}" [value]="tableBorderStyle" [disabled]="disabled || readonly || isHtmlMode" (change)="tableBorderStyle = $any($event.target).value">
      <option value="solid">{{ 'Solid' | uiText }}</option>
      <option value="dashed">{{ 'Dashed' | uiText }}</option>
      <option value="dotted">{{ 'Dotted' | uiText }}</option>
      <option value="double">{{ 'Double' | uiText }}</option>
      <option value="none">{{ 'None' | uiText }}</option>
    </select>

    <input class="table-color-input" type="color" aria-label="{{ 'Table border color' | uiText }}" [value]="tableBorderColor" [disabled]="disabled || readonly || isHtmlMode" (input)="tableBorderColor = $any($event.target).value" />

    <button type="button" class="table-action table-action-primary" [disabled]="disabled || readonly || isHtmlMode" (mousedown)="$event.preventDefault()" (click)="insertTable()">
      {{ 'Insert' | uiText }}
    </button>

    <button type="button" class="table-action" [disabled]="disabled || readonly || isHtmlMode" (click)="applyTableBorder()">
      {{ 'Apply to selected table' | uiText }}
    </button>
  </div>

  <div
    #editor
    class="wysiwyg-editor"
    [class.html-mode]="isHtmlMode"
    [attr.contenteditable]="disabled || readonly ? 'false' : 'true'"
    role="textbox"
    dir="ltr"
    [attr.aria-label]="ariaLabel"
    [attr.aria-required]="required"
    [attr.aria-invalid]="!!errorText"
    [attr.data-placeholder]="placeholder"
    [style.min-height]="minHeight"
    (input)="syncEditor($event)"
    (blur)="syncEditor($event)"
    (paste)="handlePaste($event)"
    (keydown)="handleKeydown($event)"
    (keyup)="updateActiveStates()"
    (mouseup)="updateActiveStates()"
  ></div>

  <div class="editor-footer">
    <span class="editor-error" *ngIf="errorText">{{ errorText }}</span>
    <span class="editor-counter" *ngIf="maxLength !== null">{{ plainTextLength }} / {{ maxLength }}</span>
    <span class="editor-counter" *ngIf="maxLength === null">{{ '{0} characters' | uiText: (plainTextLength) }}</span>
  </div>
</div>
