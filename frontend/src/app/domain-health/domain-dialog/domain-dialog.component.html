<h2 mat-dialog-title>{{ data.domain ? 'Edit domain' : 'Add domain' }}</h2>
<form (ngSubmit)="save()">
  <mat-dialog-content class="domain-dialog-content">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput name="name" [(ngModel)]="model.name" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Base URL</mat-label>
      <input matInput name="baseUrl" [(ngModel)]="model.baseUrl" placeholder="https://example.com" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Owner</mat-label>
      <mat-select name="owner" [(ngModel)]="model.owner" required>
        <mat-option *ngFor="let owner of owners" [value]="owner">{{ owner }}</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-slide-toggle name="enabled" [(ngModel)]="model.enabled">Enabled</mat-slide-toggle>

    <section class="health-policy-section">
      <h3>Health policy</h3>
      <mat-form-field appearance="outline">
        <mat-label>Check path</mat-label>
        <input matInput name="checkPath" [(ngModel)]="model.healthConfig.checkPath" placeholder="/health">
      </mat-form-field>
      <div class="policy-grid">
        <mat-form-field appearance="outline">
          <mat-label>Expected status min</mat-label>
          <input matInput type="number" name="expectedStatusMin" [(ngModel)]="model.healthConfig.expectedStatusMin" min="100" max="599">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Expected status max</mat-label>
          <input matInput type="number" name="expectedStatusMax" [(ngModel)]="model.healthConfig.expectedStatusMax" min="100" max="599">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Timeout ms</mat-label>
          <input matInput type="number" name="timeoutMs" [(ngModel)]="model.healthConfig.timeoutMs" min="1000" max="120000">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Warning response ms</mat-label>
          <input matInput type="number" name="warningResponseMs" [(ngModel)]="model.healthConfig.warningResponseMs" min="100" max="60000">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Error response ms</mat-label>
          <input matInput type="number" name="errorResponseMs" [(ngModel)]="model.healthConfig.errorResponseMs" min="100" max="120000">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>TLS warning days</mat-label>
          <input matInput type="number" name="tlsWarningDays" [(ngModel)]="model.healthConfig.tlsWarningDays" min="1" max="365">
        </mat-form-field>
      </div>
      <mat-slide-toggle name="followRedirects" [(ngModel)]="model.healthConfig.followRedirects">Follow redirects</mat-slide-toggle>
    </section>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="submit">
      <mat-icon class="material-symbols-outlined">save</mat-icon>
      Save
    </button>
  </mat-dialog-actions>
</form>
