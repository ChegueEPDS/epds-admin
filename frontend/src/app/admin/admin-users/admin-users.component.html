<section class="admin-page">
  <header class="page-header">
    <div>
      <h1>Users</h1>
      <p>{{ users().length }} users</p>
    </div>
    <button mat-flat-button color="primary" type="button" (click)="openAddUser()" [disabled]="!tenants().length">
      <mat-icon class="material-symbols-outlined">person_add</mat-icon>
      Add user
    </button>
  </header>

  <div class="loading" *ngIf="loading()">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <table mat-table [dataSource]="users()" class="admin-table" *ngIf="!loading()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">{{ user.firstName }} {{ user.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">{{ roleLabel(user.role) }}</td>
    </ng-container>

    <ng-container matColumnDef="tenant">
      <th mat-header-cell *matHeaderCellDef>Tenant</th>
      <td mat-cell *matCellDef="let user">{{ user.tenantDisplayName || user.tenantName || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="lastLogin">
      <th mat-header-cell *matHeaderCellDef>Last login</th>
      <td mat-cell *matCellDef="let user">{{ user.lastLoginAt ? (user.lastLoginAt | date:'yyyy-MM-dd HH:mm') : '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let user" class="actions-cell">
        <button mat-icon-button type="button" matTooltip="Edit user" (click)="openEditUser(user)" [disabled]="user.role === 'SuperAdmin'">
          <mat-icon class="material-symbols-outlined">edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div class="empty-state" *ngIf="!loading() && !users().length">No users.</div>
</section>
