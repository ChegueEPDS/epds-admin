<h2 mat-dialog-title>{{ title }}</h2>

<form class="dialog-form" #userForm="ngForm" (ngSubmit)="save()">
  <mat-dialog-content>
    <div class="name-grid">
      <mat-form-field appearance="outline">
        <mat-label>First name</mat-label>
        <input matInput name="firstName" [(ngModel)]="firstName" [disabled]="isMicrosoftUser" required>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last name</mat-label>
        <input matInput name="lastName" [(ngModel)]="lastName" [disabled]="isMicrosoftUser" required>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" name="email" [(ngModel)]="email" email [disabled]="isMicrosoftUser" required>
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="!isEditMode">
      <mat-label>Sign-in method</mat-label>
      <mat-select name="loginMethod" [(ngModel)]="loginMethod" required>
        <mat-option value="microsoft">Microsoft</mat-option>
        <mat-option value="password">Email and password</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ data.isSuperAdmin ? 'Primary tenant' : 'Tenant' }}</mat-label>
      <mat-select name="tenantId" [(ngModel)]="tenantId" (ngModelChange)="onTenantChange()" required>
        <mat-option *ngFor="let tenant of data.tenants" [value]="tenant.id">
          {{ tenantLabel(tenant) }} ({{ tenant.type }})
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="data.isSuperAdmin && tenantId && role !== 'Finance' && additionalTenantOptions.length">
      <mat-label>Additional tenants</mat-label>
      <mat-select name="additionalTenantIds" [(ngModel)]="additionalTenantIds" multiple>
        <mat-option *ngFor="let tenant of additionalTenantOptions" [value]="tenant.id">
          {{ tenantLabel(tenant) }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Role</mat-label>
      <mat-select name="role" [(ngModel)]="role" required>
        <mat-option *ngFor="let roleOption of roles" [value]="roleOption.value">
          {{ roleOption.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving() || !userForm.valid">{{ submitLabel }}</button>
  </mat-dialog-actions>
</form>
